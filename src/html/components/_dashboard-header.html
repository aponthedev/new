<!-- dashboard header -->
<header class="dashboard-header">
  <div class="dashboard-header__left">
    <button class="dashboard-header__menu dashboard-mobile-only" type="button" data-toggle="offcanvas-sidebar" data-target="#dashboard-sidebar">
      <i class="fa-solid fa-bars"></i>
    </button>
    <form class="dashboard-header__search">
      <input class="dashboard-header__search-input" type="text" placeholder="Search here...">
      <button class="dashboard-header__search-btn" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>
  </div>

  <div class="dashboard-header__right">
    <div class="dashboard-header__profile dropdown">
      <button class="dashboard-header__avatar" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="dashboard-header__avatar-text">AS</span>
      </button>
      <div class="dropdown-menu dropdown-menu-end dashboard-header__dropdown">
        <div class="dashboard-header__dropdown-user">
          <span class="dashboard-header__dropdown-avatar">AS</span>
          <div>
            <div class="h6 dashboard-header__dropdown-name">Ashraf Smith</div>
            <p>Premium Member</p>
          </div>
        </div>
        <a class="dropdown-item" href="#">
          <i class="fa-regular fa-user"></i>
          My Profile
        </a>
        <a class="dropdown-item" href="#">
          <i class="fa-solid fa-gear"></i>
          Settings
        </a>
        <a class="dropdown-item" href="#">
          <i class="fa-solid fa-shield-halved"></i>
          Security
        </a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item dashboard-header__dropdown-logout" href="login.html">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </a>
      </div>
    </div>
  </div>
</header>
<!-- dashboard header -->
